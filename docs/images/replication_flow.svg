<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <style>
    .box { fill:#f5f7fa; stroke:#2b6cb0; stroke-width:1.5; rx:6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#1a202c }
    .arrow { stroke:#2d3748; stroke-width:1.8; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748" />
    </marker>
  </defs>

  <rect class="box" x="30" y="30" width="180" height="60" />
  <text class="text" x="40" y="55">Producer</text>

  <rect class="box" x="260" y="10" width="200" height="100" />
  <text class="text" x="275" y="35">Leader Broker</text>
  <text class="text" x="275" y="55">append to log (LEO)</text>
  <text class="text" x="275" y="75">advance HW when replicated</text>

  <rect class="box" x="520" y="10" width="200" height="60" />
  <text class="text" x="535" y="40">Follower Broker(s)</text>

  <path class="arrow" d="M210 60 L260 60" />
  <path class="arrow" d="M460 60 L520 60" />
  <path class="arrow" d="M520 90 L460 120 L360 120" />

  <text class="text" x="220" y="45">ProduceRequest</text>
  <text class="text" x="380" y="135">Follower fetch -> append -> ack (LEO)</text>
</svg>

